<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wanderly · Gemma 4 Travel Planner</title>
  <meta name="description" content="AI travel planner powered by Gemma 4: itineraries, nearby places, photo lens, recommendations.">
  <meta name="theme-color" content="#5b47e0">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/static/css/styles.css">
  <script>
    // Apply saved theme before paint to avoid a flash.
    try { const t = JSON.parse(localStorage.getItem('wanderly.settings') || '{}').theme; if (t && t !== 'system') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="app">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/" aria-label="Wanderly home">
        <span class="brand-logo" aria-hidden="true">🧭</span>
        <span class="brand-text"><span class="brand-name">Wanderly</span><small>Powered by Gemma 4</small></span>
      </a>
      <a class="btn btn-hero sidebar-cta" href="#/plan" title="Plan a new trip"><span aria-hidden="true">✈️</span><span class="label">New trip</span></a>
      <nav class="nav">
        <div class="nav-section">Plan</div>
        <a class="nav-link" href="#/" data-route="" title="Home"><span class="ic" aria-hidden="true">🏠</span><span class="label">Home</span></a>
        <a class="nav-link" href="#/plan" data-route="plan" title="Plan a trip"><span class="ic" aria-hidden="true">🗺️</span><span class="label">Plan a trip</span></a>
        <a class="nav-link" href="#/discover" data-route="discover" title="Find my destination"><span class="ic" aria-hidden="true">✨</span><span class="label">Find my destination</span></a>
        <a class="nav-link" href="#/trips" data-route="trips" title="My trips"><span class="ic" aria-hidden="true">🧳</span><span class="label">My trips</span><span class="nav-badge hidden" id="trips-count"></span></a>
        <div class="nav-section">Explore</div>
        <a class="nav-link" href="#/nearby" data-route="nearby" title="Nearby places"><span class="ic" aria-hidden="true">📍</span><span class="label">Nearby places</span></a>
        <a class="nav-link" href="#/lens" data-route="lens" title="Travel Lens"><span class="ic" aria-hidden="true">📷</span><span class="label">Travel Lens</span></a>
        <a class="nav-link" href="#/foryou" data-route="foryou" title="For you"><span class="ic" aria-hidden="true">💜</span><span class="label">For you</span></a>
        <a class="nav-link" href="#/chat" data-route="chat" title="Travel buddy"><span class="ic" aria-hidden="true">💬</span><span class="label">Travel buddy</span></a>
        <div class="nav-section">App</div>
        <a class="nav-link" href="#/demo" data-route="demo" title="Demo showcase"><span class="ic" aria-hidden="true">🎬</span><span class="label">Demo showcase</span></a>
        <a class="nav-link" href="#/settings" data-route="settings" title="Settings"><span class="ic" aria-hidden="true">⚙️</span><span class="label">Settings</span></a>
      </nav>
      <div class="sidebar-foot">
        <a class="status-card" href="#/settings" title="Gemma 4 status">
          <span class="status-dot" id="ai-dot" aria-hidden="true"></span>
          <span class="label"><b>Gemma 4 status</b><span id="ai-status" class="tiny">Checking…</span></span>
        </a>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <a class="mobile-brand brand-logo" href="#/" aria-label="Home">🧭</a>
        <div class="topbar-title" id="page-title">Wanderly</div>
        <span id="provider-badge" class="badge-ai hidden"><span class="dot"></span><span></span></span>
        <label class="demo-toggle" title="Use built-in demo data (works offline)">
          <span class="switch"><input type="checkbox" id="demo-switch" aria-label="Demo mode"><span></span></span>
          <span>Demo</span>
        </label>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Mobile navigation">
    <a href="#/" data-route=""><span class="ic">🏠</span>Home</a>
    <a href="#/plan" data-route="plan"><span class="ic">🗺️</span>Plan</a>
    <a href="#/nearby" data-route="nearby"><span class="ic">📍</span>Nearby</a>
    <a href="#/lens" data-route="lens"><span class="ic">📷</span>Lens</a>
    <a href="#/chat" data-route="chat"><span class="ic">💬</span>Chat</a>
    <a href="#/more" data-route="more"><span class="ic">☰</span>More</a>
  </nav>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="/static/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
